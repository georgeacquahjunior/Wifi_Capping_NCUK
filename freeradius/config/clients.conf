#
# FreeRADIUS Client Configuration
# This file defines RADIUS clients (access points, controllers)
#

# Default client for testing
client localhost {
    ipaddr = 127.0.0.1
    secret = testing123
    require_message_authenticator = no
    nas_type = other
    limit {
        max_connections = 16
        lifetime = 0
        idle_timeout = 30
    }
}

# Local network clients (adjust IP ranges as needed)
client localnet {
    ipaddr = 192.168.1.0/24
    secret = ncuk_wifi_secret_2024
    require_message_authenticator = yes
    nas_type = access_point
    limit {
        max_connections = 32
        lifetime = 0
        idle_timeout = 300
    }
}

# NCUK WiFi Access Points
client ncuk_ap_main {
    ipaddr = 192.168.10.1
    secret = ncuk_main_ap_secret
    shortname = main-ap
    nas_type = access_point
    require_message_authenticator = yes
}

client ncuk_ap_guest {
    ipaddr = 192.168.10.2
    secret = ncuk_guest_ap_secret
    shortname = guest-ap
    nas_type = access_point
    require_message_authenticator = yes
}

# Dynamic clients (for cloud deployments)
client dynamic {
    ipaddr = 0.0.0.0/0
    secret = ""
    dynamic = yes
    lifetime = 3600
    require_message_authenticator = yes
}

# Default shared secret for emergency access
# NOTE: Change this in production!
default_secret = emergency_radius_key_change_me