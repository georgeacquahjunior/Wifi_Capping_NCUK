# WiFi Capping NAS Clients Configuration
# /etc/freeradius/3.0/clients.conf

# Default client for local testing
client localhost {
    ipaddr = 127.0.0.1
    secret = testing123
    require_message_authenticator = no
    nas_type = other
}

# Main WiFi Controller
client main_wifi_controller {
    ipaddr = 192.168.1.1
    secret = nas_secret_key
    shortname = main-wifi
    nas_type = wireless
    virtual_server = wifi-capping
}

# Library WiFi Controller
client library_wifi_controller {
    ipaddr = 192.168.1.2
    secret = library_secret
    shortname = library-wifi
    nas_type = wireless
    virtual_server = wifi-capping
}

# Dormitory WiFi Controller
client dorm_wifi_controller {
    ipaddr = 192.168.1.3
    secret = dorm_secret
    shortname = dorm-wifi
    nas_type = wireless
    virtual_server = wifi-capping
}

# Network range for dynamic clients (if needed)
client wifi_network {
    ipaddr = 192.168.1.0/24
    secret = default_nas_secret
    shortname = wifi-network
    nas_type = wireless
    virtual_server = wifi-capping
}