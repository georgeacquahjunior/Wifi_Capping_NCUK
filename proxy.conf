# proxy.conf - Proxy configuration for FreeRADIUS CoA support
# Configuration for proxying RADIUS requests and CoA packets

# Proxy configuration
proxy server {
    # Enable proxy functionality
    default_fallback = no
    
    # Don't strip realm from User-Name
    strip_realm = no
    
    # Retry configuration
    retry_delay = 5
    retry_count = 3
    
    # Dead time for unresponsive servers
    dead_time = 120
    
    # Cleanup delay
    cleanup_delay = 5
    
    # Fallback to default
    fallback = no
    
    # Authentication and accounting timeouts
    auth_pool {
        type = fail-over
        retry_delay = 5
        retry_count = 3
    }
    
    acct_pool {
        type = fail-over
        retry_delay = 5
        retry_count = 3
    }
    
    # CoA pool configuration for Change of Authorization
    coa_pool {
        type = fail-over
        retry_delay = 2
        retry_count = 5
    }
}

# Home server configuration for CoA
home_server coa_server_local {
    type = coa
    ipaddr = 127.0.0.1
    port = 3799
    secret = testing123
    
    # CoA specific configuration
    coa_nak_delay = 2
    
    # Timeouts for CoA packets
    response_timeout = 6
    max_outstanding = 65536
    
    # Zombie period
    zombie_period = 40
    
    # Status check
    status_check = status-server
    ping_check = none
    
    # Revival delay
    revive_interval = 120
    
    # Check interval
    check_timeout = 4
    num_answers_to_alive = 3
}

# Home server for WiFi controller CoA
home_server wifi_coa_server {
    type = coa
    ipaddr = 192.168.1.10
    port = 3799
    secret = your_shared_secret_here
    
    # CoA configuration
    coa_nak_delay = 1
    
    response_timeout = 10
    max_outstanding = 100
    zombie_period = 60
    
    status_check = status-server
    ping_check = none
    revive_interval = 300
    
    check_timeout = 6
    num_answers_to_alive = 2
}

# Home server pool for CoA load balancing
home_server_pool coa_pool {
    type = fail-over
    
    home_server = coa_server_local
    home_server = wifi_coa_server
    
    # Fallback configuration
    fallback = coa_server_local
    
    # Virtual server for CoA processing
    virtual_server = coa_disconnect
}

# Realm configuration for CoA
realm coa_realm {
    # No auth or acct pool for CoA realm
    # Only CoA pool is relevant
    pool = coa_pool
    
    # Don't strip realm
    strip_realm = no
    
    # CoA specific realm
    type = radius
}

# Default realm configuration
realm LOCAL {
    # Local realm - don't proxy
    type = radius
}

# Example realm for NCUK
realm ncuk.ac.uk {
    type = radius
    
    # Authentication pool (if needed)
    auth_pool = coa_pool
    
    # Accounting pool (if needed)  
    acct_pool = coa_pool
    
    # CoA pool for disconnect functionality
    pool = coa_pool
    
    # Don't strip realm for tracking
    strip_realm = no
}

# Null realm for handling requests without realm
realm NULL {
    type = radius
    authhost = LOCAL
    accthost = LOCAL
}