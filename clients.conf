# clients.conf - Client configuration for FreeRADIUS with CoA support
# Define NAS (Network Access Server) clients that can send RADIUS requests
# and receive CoA (Change of Authorization) packets

# Localhost client for testing
client localhost {
    ipaddr = 127.0.0.1
    secret = testing123
    require_message_authenticator = no
    shortname = localhost
    
    # CoA configuration for this client
    coa_server = 127.0.0.1:3799
    
    # Support for disconnect and CoA packets
    proto = *
    
    # Limit on the number of requests from this client
    limit {
        max_connections = 16
        lifetime = 0
        idle_timeout = 30
    }
}

# IPv6 localhost
client localhost_ipv6 {
    ipv6addr = ::1
    secret = testing123
    shortname = localhost_ipv6
    
    coa_server = [::1]:3799
    proto = *
}

# Example WiFi Access Point / Wireless Controller
client wifi_controller {
    ipaddr = 192.168.1.0/24
    secret = your_shared_secret_here
    shortname = wifi_ap
    
    # CoA server configuration for this client
    coa_server = 192.168.1.10:3799
    
    # NAS (Network Access Server) type
    nastype = other
    
    # Support all protocols including CoA
    proto = *
    
    # Virtual server to use for this client
    virtual_server = default
    
    limit {
        max_connections = 32
        lifetime = 0
        idle_timeout = 60
    }
}

# Example for a range of WiFi access points
client wifi_network {
    ipaddr = 10.0.0.0/16
    secret = wifi_network_secret
    shortname = wifi_net
    
    # CoA configuration
    coa_server = 10.0.0.100:3799
    
    # Enable all protocols for CoA support
    proto = *
    
    # Specific virtual server for WiFi
    virtual_server = wifi_capping
    
    limit {
        max_connections = 100
        lifetime = 0
        idle_timeout = 120
    }
}

# Generic client for NCUK network infrastructure
client ncuk_infrastructure {
    ipaddr = 172.16.0.0/12
    secret = ncuk_radius_secret_2024
    shortname = ncuk_infra
    
    # CoA configuration for disconnect functionality
    coa_server = 172.16.1.1:3799
    
    # Support for all RADIUS packet types including CoA
    proto = *
    
    # Custom virtual server for NCUK WiFi capping
    virtual_server = ncuk_wifi_capping
    
    # Higher limits for university infrastructure
    limit {
        max_connections = 200
        lifetime = 0
        idle_timeout = 300
    }
}

# Management client for sending CoA disconnect packets
client coa_management {
    ipaddr = 192.168.100.0/24
    secret = coa_management_secret
    shortname = coa_mgmt
    
    # This client can send CoA packets
    proto = coa
    
    # No specific CoA server needed as this client sends CoA
    
    limit {
        max_connections = 10
        lifetime = 0
        idle_timeout = 60
    }
}

