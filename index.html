<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="WiFi Capping Management System for NCUK (Northern Consortium of UK Universities)">
    <meta name="keywords" content="wifi, bandwidth, management, ncuk, university, network">
    <meta name="author" content="NCUK">
    
    <!-- Security Headers -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-Frame-Options" content="DENY">
    <meta http-equiv="X-XSS-Protection" content="1; mode=block">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    
    <!-- Content Security Policy -->
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self';
        script-src 'self' 'nonce-{SCRIPT_NONCE}';
        style-src 'self' 'unsafe-inline';
        img-src 'self' data: https:;
        font-src 'self';
        connect-src 'self';
        frame-ancestors 'none';
        object-src 'none';
        upgrade-insecure-requests
    ">
    
    <title>WiFi Capping NCUK - Network Management Dashboard</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    
    <!-- Preload critical resources -->
    <link rel="preload" href="./src/styles/design-system.css" as="style">
    <link rel="preload" href="./src/styles/components.css" as="style">
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="./src/styles/design-system.css">
    <link rel="stylesheet" href="./src/styles/components.css">
</head>

                <p class="text-gray-500">Please wait while we initialize the application...</p>
            </div>
        </div>
    </div>
