# FreeRADIUS main configuration file for WiFi Capping with CoA support
# Configuration for Change of Authorization (CoA) disconnect functionality

prefix = /usr
exec_prefix = ${prefix}
sysconfdir = /etc
localstatedir = /var
sbindir = ${exec_prefix}/sbin
logdir = ${localstatedir}/log/radius
raddbdir = ${sysconfdir}/raddb
radacctdir = ${logdir}/radacct

# Name of the running server
name = radiusd

# Location of config and logfiles
confdir = ${raddbdir}
modconfdir = ${confdir}/mods-config
certdir = ${confdir}/certs
cadir = ${confdir}/certs
run_dir = ${localstatedir}/run/radiusd

# Should likely be ${localstatedir}/lib/radiusd
db_dir = ${raddbdir}

# libdir: Where to find the rlm_* modules
libdir = /usr/lib64/freeradius

# pidfile: Where to place the PID of the RADIUS server
pidfile = ${run_dir}/radiusd.pid

# max_request_time: The maximum time (in seconds) to handle a request
max_request_time = 30

# cleanup_delay: The time to wait (in seconds) before cleaning up
cleanup_delay = 5

# max_requests: The maximum number of requests which the server keeps
max_requests = 16384

# listen: Make the server listen on a particular IP address, and send
listen {
    type = auth
    ipaddr = *
    port = 1812
    limit {
        max_connections = 16
        lifetime = 0
        idle_timeout = 30
    }
}

# Accounting listener
listen {
    type = acct
    ipaddr = *
    port = 1813
    limit {
        max_connections = 16
        lifetime = 0
        idle_timeout = 30
    }
}

# CoA (Change of Authorization) listener - ESSENTIAL for CoA disconnect
listen {
    type = coa
    ipaddr = *
    port = 3799
    limit {
        max_connections = 16
        lifetime = 0
        idle_timeout = 30
    }
}

# hostname_lookups: Log the names of clients or just their IP addresses
hostname_lookups = no

# Core dumps are a bad thing. This should only be set to 'yes'
allow_core_dumps = no

# Regular expressions
regular_expressions = yes
extended_expressions = yes

# Logging section
log {
    destination = files
    colourise = yes
    file = ${logdir}/radius.log
    syslog_facility = daemon
    stripped_names = no
    auth = yes
    auth_badpass = yes
    auth_goodpass = yes
    msg_denied = "You are already logged in - access denied"
}

# Check configuration files
checkrad = ${sbindir}/checkrad

# SECURITY CONFIGURATION
security {
    allow_vulnerable_openssl = no
    max_attributes = 200
    reject_delay = 1
    status_server = yes
    allow_missing_message_authenticator = no
}

# PROXY CONFIGURATION for CoA
proxy_requests = yes
$INCLUDE proxy.conf

# CLIENTS CONFIGURATION
$INCLUDE clients.conf

# THREAD POOL CONFIGURATION
thread pool {
    start_servers = 5
    max_servers = 32
    min_spare_servers = 3
    max_spare_servers = 10
    max_requests_per_server = 0
    auto_limit_acct = no
}

# MODULE CONFIGURATION
modules {
    $INCLUDE mods-enabled/
}

# Instantiation
instantiate {
    # Put any modules that you want to instantiate here
}

# Policies
policy {
    $INCLUDE policy.d/
}

# Virtual servers
$INCLUDE sites-enabled/