# Basic module configurations for FreeRADIUS with CoA support

# Always module - always returns specified result
always {
    rcode = ok
    simulcount = 0
    mpp = no
}

# Detail module for logging
detail {
    filename = ${radacctdir}/%{%{Packet-Src-IP-Address}:-%{Packet-Src-IPv6-Address}}/detail-%Y%m%d
    header = "%t"
    permissions = 0600
    locking = no
    escape_filenames = no
    log_packet_header = no
}

# Files module for user/client lookups
files {
    filename = ${confdir}/users
    acctusersfile = ${confdir}/acct_users
    preproxy_usersfile = ${confdir}/preproxy_users
}

# Preprocess module
preprocess {
    huntgroups = ${confdir}/huntgroups
    hints = ${confdir}/hints
    with_ascend_hack = no
    ascend_channels_per_line = 23
    with_ntdomain_hack = no
    with_specialix_jetstream_hack = no
    with_cisco_vsa_hack = no
    with_alvarion_vsa_hack = no
}

# PAP module
pap {
    auto_header = no
    normalise = yes
}

# CHAP module  
chap {
}

# MS-CHAP module
mschap {
    with_ntdomain_hack = yes
    ntlm_auth = "/usr/bin/ntlm_auth --request-nt-key --domain=%{%{mschap:NT-Domain}:-WORKGROUP} --username=%{%{Stripped-User-Name}:-%{User-Name}} --password=%{User-Password}"
}

# EAP module for WiFi authentication
eap {
    default_eap_type = peap
    timer_expire = 60
    ignore_unknown_eap_types = no
    cisco_accounting_username_bug = no
    max_sessions = 1024

    # TLS configuration for EAP-TLS, PEAP, EAP-TTLS
    tls-config tls-common {
        private_key_password = whatever
        private_key_file = ${certdir}/server.pem
        certificate_file = ${certdir}/server.pem
        ca_file = ${certdir}/ca.pem
        dh_file = ${certdir}/dh
        ca_path = ${cadir}
        cipher_list = "DEFAULT"
        cipher_server_preference = no
        tls_min_version = "1.2"
        tls_max_version = "1.3"
        ecdh_curve = "prime256v1"
        cache {
            enable = no
            lifetime = 24
            max_entries = 255
        }
        verify {
        }
        ocsp {
            enable = no
            override_cert_url = yes
            url = "http://127.0.0.1/ocsp/"
            use_nonce = yes
            timeout = 0
            softfail = no
        }
    }

    # EAP-PEAP
    peap {
        tls = tls-common
        default_method = mschapv2
        copy_request_to_tunnel = no
        use_tunneled_reply = no
        virtual_server = "inner-tunnel"
    }

    # EAP-MSCHAPv2
    mschapv2 {
        with_ntdomain_hack = yes
        send_error = no
    }
}

# Digest module
digest {
}

# Exec module for external scripts
exec {
    wait = no
    program = "/bin/echo"
    input_pairs = request
    output_pairs = reply
    packet_type = Access-Request
}

# Attribute filter modules
attr_filter.access_reject {
    filename = ${confdir}/attrs.access_reject
    key = "%{User-Name}"
    relaxed = yes
}

attr_filter.accounting_response {
    filename = ${confdir}/attrs.accounting_response
    key = "%{User-Name}"
    relaxed = yes
}

# Unix module for system authentication
unix {
    cache = no
    cache_reload = 600
    passwd = /etc/passwd
    shadow = /etc/shadow
    group = /etc/group
    radwtmp = ${logdir}/radwtmp
}

# Counter module for session limits
counter daily {
    filename = ${db_dir}/db.daily
    key = "%{User-Name}"
    count_attribute = Acct-Session-Time
    reset = daily
    counter_name = Daily-Session-Time
    check_name = Max-Daily-Session
    reply_name = Session-Timeout
    allowed_servicetype = Framed-User
    cache_size = 5000
}

