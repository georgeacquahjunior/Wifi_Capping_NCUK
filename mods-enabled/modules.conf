# Session database (file-based for simplicity)
session {
    filename = ${logdir}/radutmp
    username = "%{User-Name}"
    case_sensitive = yes
    check_with_nas = yes
    permission = 0600
    callerid = yes
}

# Unique accounting session ID
acct_unique {
    key = "User-Name, Acct-Session-Id, NAS-IP-Address, Client-IP-Address, NAS-Port"
}